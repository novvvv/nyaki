# 서버 테스트 — 다른 워크플로가 불러 쓴다(workflow_call).
#
# **Postgres로 돈다.** 운영이 Postgres인데 테스트만 SQLite로 돌리면 JSONB처럼
# 한쪽에만 있는 문법을 검증할 수 없다.
#
# **마이그레이션을 실제로 실행한다.** 테스트는 create_all로 스키마를 만들어서
# 마이그레이션 파일을 한 줄도 타지 않는다. 2026-09-24에 0012 백필 SQL의 콜론이
# 바인드 파라미터로 해석돼 운영이 내려간 적이 있는데, 테스트 69개가 전부
# 통과한 상태였다. 그 구멍을 여기서 막는다.
name: API tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nyaki
          POSTGRES_PASSWORD: nyaki
          POSTGRES_DB: nyaki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://nyaki:nyaki@localhost:5432/nyaki_test
      # 로컬은 api/.env가 채워주지만 CI에는 그 파일이 없다.
      # 테스트는 인증을 덮어쓰므로(get_current_user_id) 값 자체는 쓰이지 않는다.
      FIREBASE_PROJECT_ID: ci-test
      PYTHONPATH: .

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Migrations run on a real Postgres
        run: alembic upgrade head

      - name: Migrations are reversible
        # 되돌릴 수 없는 마이그레이션은 사고가 났을 때 손이 묶인다.
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: Tests
        run: pytest -q
